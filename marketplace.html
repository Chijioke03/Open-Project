<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace - Credlink</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/marketplace.css">
</head>
<body>
    <div class="marketplace-container">
        <!-- Header -->
        <div class="marketplace-header">
            <div class="header-content">
                <h1>Marketplace</h1>
                <p>Connect with borrowers and lenders</p>
            </div>
            <nav class="marketplace-nav">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="marketplace.html" class="nav-link active">Marketplace</a>
            </nav>
            <div class="header-actions">
                <button class="profile-btn" onclick="window.location.href='dashboard.html'">👤 Profile</button>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>

        <!-- Post Offer Section -->
        <div class="post-offer-section">
            <div class="section-header">
                <h2>Post Your Offer</h2>
                <p>Share your lending offer or borrowing request</p>
            </div>

            <div class="offer-form-container">
                <form id="offer-form" class="offer-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="offer-type">I want to:</label>
                            <select id="offer-type" name="type" required>
                                <option value="">Select type</option>
                                <option value="lend">Lend Money</option>
                                <option value="borrow">Borrow Money</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="amount">Amount (₦)</label>
                            <input type="number" id="amount" name="amount" placeholder="5000" min="100" max="100000" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="interest-rate">Interest Rate (%)</label>
                            <input type="number" id="interest-rate" name="interestRate" placeholder="8.5" min="0" max="50" step="0.1" required>
                        </div>

                        <div class="form-group">
                            <label for="duration">Duration (months)</label>
                            <input type="number" id="duration" name="duration" placeholder="12" min="1" max="120" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" placeholder="Describe your offer or requirements..." rows="3" maxlength="500"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="contact-method">Preferred Contact Method</label>
                        <select id="contact-method" name="contactMethod" required>
                            <option value="">Select contact method</option>
                            <option value="email">Email</option>
                            <option value="phone">Phone</option>
                            <option value="platform">Through Platform</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-primary">Post Offer</button>
                </form>
            </div>
        </div>

        <!-- Offers List Section -->
        <div class="offers-section">
            <div class="section-header">
                <h2>Available Offers</h2>
                <div class="filters">
                    <select id="filter-type" onchange="filterOffers()">
                        <option value="all">All Offers</option>
                        <option value="lend">Lending Offers</option>
                        <option value="borrow">Borrowing Requests</option>
                    </select>
                    <input type="text" id="search-amount" placeholder="Search by amount..." onkeyup="filterOffers()">
                </div>
            </div>

            <div id="offers-list" class="offers-list">
                <!-- Offers will be dynamically loaded here -->
            </div>

            <div id="no-offers" class="no-offers" style="display: none;">
                <p>No offers found matching your criteria.</p>
            </div>
        </div>
    </div>

    <!-- Success/Error Messages -->
    <div id="message-container" class="message-container" style="display: none;">
        <div class="message">
            <span id="message-text"></span>
            <button onclick="hideMessage()">×</button>
        </div>
    </div>

    <script src="js/marketplace.js"></script>
</body>
</html>
